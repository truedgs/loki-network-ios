name: v2ray_vpn
description: "LOKI Network VPN client with HWID authentication, free and premium servers."
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_v2ray: ^1.0.10
  flutter_vless: ^1.1.6
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_vless_windows:
    path: third_party/flutter_vless_windows
  flutter_vless_android:
    path: third_party/flutter_vless_android_noop

flutter:
  uses-material-design: true
